<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="Basketball Scoreboard" />
    <meta property="og:description" content="Every Second. Every Point." />
    <meta property="og:image" content="images/preview.png" />
    <meta property="og:url" content="https://shcodex.netlify.app/" />
    <title>Basketball ScoreBoard</title>

    <link rel="stylesheet" href="scoreboard.css" />
  </head>
  <body>
    <main>
      <h1>BASKETBALL SCOREBOARD</h1>
      <p>Every Second. Every Point.</p>
      <div class="board_container">
        <div class="score_wrapper">
          <h3>Home</h3>
          <h4 id="homeScore">0</h4>
          <div class="btns">
            <button onclick="updateHome(1)">+1</button>
            <button onclick="updateHome(2)">2</button>
            <button onclick="updateHome(3)">+3</button>
          </div>
        </div>

        <div class="score_wrapper">
          <h3>Away</h3>
          <h4 id="guestScore">0</h4>
          <div class="btns">
            <button onclick="updateGuest(1)">+1</button>
            <button onclick="updateGuest(2)">+2</button>
            <button onclick="updateGuest(3)">+3</button>
          </div>
        </div>
      </div>
      <h5 id="leadingTeam"></h5>
      <button id="reset_btn" onclick="resetGame()">Reset</button>
    </main>
    <script src="scoreboard.js"></script>
  </body>
</html>
